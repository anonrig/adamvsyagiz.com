name = "adamvsyagiz"
compatibility_date = "2026-08-30"
compatibility_flags = ["nodejs_compat"]
send_metrics = false
preview_urls = true
main = "./src/worker.ts"

[cache]
enabled = true

[placement]
mode = "smart"

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "404-page"
run_worker_first = true

[observability]
enabled = true
